name: Build ytweb IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create Xcode Project
        run: |
          mkdir ytweb
          cd ytweb
          
          cat > ytweb.swift <<EOF
          import UIKit
          import WebKit

          class ViewController: UIViewController {

              var webView: WKWebView!

              override func loadView() {
                  webView = WKWebView()
                  view = webView
              }

              override func viewDidLoad() {
                  super.viewDidLoad()
                  let url = URL(string: "https://m.youtube.com")!
                  webView.load(URLRequest(url: url))
                  webView.allowsBackForwardNavigationGestures = true
              }
          }

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {

              var window: UIWindow?

              func application(
                  _ application: UIApplication,
                  didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?
              ) -> Bool {

                  window = UIWindow(frame: UIScreen.main.bounds)
                  window?.rootViewController = ViewController()
                  window?.makeKeyAndVisible()

                  return true
              }
          }
          EOF

          cat > Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.ytweb.app</string>
              <key>CFBundleName</key>
              <string>ytweb</string>
              <key>CFBundleExecutable</key>
              <string>ytweb</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -project /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/Library/Xcode/Templates/Project Templates/iOS/Application/Single View App.xctemplate \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO

      - name: Build App
        run: |
          xcodebuild \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir Payload
          cp -r build/Release-iphoneos/*.app Payload/
          zip -r ytweb.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ytweb
          path: ytweb.ipa
